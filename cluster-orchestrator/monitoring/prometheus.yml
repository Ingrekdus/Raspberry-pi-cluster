global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'node_exporters'
    static_configs:
      - targets:
          - '192.168.1.111:9100'  # RP1 master
          - '192.168.1.103:9100'  # RP2 worker
          - '192.168.1.105:9100'  # RP3 worker
          - '192.168.1.107:9100'  # RP4 worker
          
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '192.168.1.111:8080'  # RP1 master
          - '192.168.1.103:8080'  # RP2 worker
          - '192.168.1.105:8080'  # RP3 worker
          - '192.168.1.107:8080'  # RP4 worker
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'node_exporters'
    static_configs:
      - targets:
          - '192.168.1.111:9100'
          - '192.168.1.103:9100'
          - '192.168.1.105:9100'
          - '192.168.1.107:9100'
          
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '192.168.1.111:8080'
          - '192.168.1.103:8080'
          - '192.168.1.105:8080'
          - '192.168.1.107:8080'
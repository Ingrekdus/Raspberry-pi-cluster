version: '3.8'

services:
  flask-app:
    image: 192.168.1.111:5000/flask-app:v1
    deploy:
      replicas: 6
      restart_policy:
        condition: on-failure
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    ports:
      - "8888:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - webnet

configs:
  nginx_config:
    file: ./nginx.conf

networks:
  webnet:
    driver: overlay
